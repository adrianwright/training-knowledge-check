[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "training-knowledge-check"
version = "0.1.0"
description = "A fictional two-agent knowledge-check workflow with Microsoft Agent 365 observability."
requires-python = ">=3.11"
dependencies = [
  "azure-ai-projects==2.4.0",
  "azure-identity>=1.25,<2",
  "httpx>=0.28,<1",
  "openai>=2.54,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
knowledge-check = "knowledge_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
